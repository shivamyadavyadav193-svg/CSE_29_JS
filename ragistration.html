<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
     <link rel="stylesheet" href="stylerag.css">   

    
</head>

<body>

<form action="submit_form.html" method="post">
    <center>

<table border="1">

    <tr>
        <td colspan="2" class="title">
            Student Registration Form
        </td>
    </tr>

    <tr>
        <td><b>Full Name</b></td>
        <td>
            <input type="text" name="name" placeholder="Enter your full name" required>
        </td>
    </tr>

    <tr>
        <td><b>Email</b></td>
        <td>
            <input type="email" name="email" placeholder="Enter your email" required>
        </td>
    </tr>

    <tr>
        <td><b>Age</b></td>
        <td>
            <input type="number" name="age" placeholder="Enter your age" required>
        </td>
    </tr>

    <tr>
        <td><b>Gender</b></td>
        <td>
            <select name="gender" required>
                <option value="">--Select Gender--</option>
                <option>Male</option>
                <option>Female</option>
                <option>Other</option>
            </select>
        </td>
    </tr>

    <tr>
        <td><b>Course</b></td>
        <td>
            <input type="text" name="course" placeholder="Enter Course Name" required>
        </td>
    </tr>

    <tr>
        <td><b>Address</b></td>
        <td>
            <textarea name="address" rows="4" placeholder="Enter your address" required></textarea>
        </td>
    </tr>

    <tr>
        <td colspan="2" align="center">
            <input type="submit" value="Register">
            &nbsp;&nbsp;
            <input type="reset" value="Reset">
        </td>
    </tr>

    <tr>
        
        </td>
    </tr>

</table>
</center>

</form>

</body>
</html>
